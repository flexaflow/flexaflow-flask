{% extends "main/master.html" %}
{% block content %}
<div class="container py-4" style="max-width:560px">
	<h1>{{ heading }}</h1>
	{% if intro %}<p>{{ intro }}</p>{% endif %}
	{% if done %}<p role="status"><strong>Thank you for subscribing.</strong></p>
	{% else %}
	{% if error %}<p role="alert" style="color:#b00020">{{ error }}</p>{% endif %}
	<form method="post" action="/newsletter/">
		<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
		<div style="position:absolute;left:-10000px" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
		<div class="input-group">
			<input type="email" name="email" class="form-control" placeholder="you@example.com" required maxlength="255" aria-label="Email address">
			<button class="btn btn-primary">Subscribe</button>
		</div>
	</form>
	{% endif %}
</div>
{% endblock %}
