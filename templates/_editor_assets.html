<script src="https://cdn.jsdelivr.net/npm/tinymce@5/tinymce.min.js" referrerpolicy="origin"></script>

{% include "_media_picker.html" %}

<script>
(function ($) {
	function uploadHandler(blobInfo, success, failure, progress) {
		var xhr = new XMLHttpRequest();
		xhr.open('POST', '/upload_image');
		xhr.setRequestHeader('X-CSRF-Token', window.FlexaAdmin.csrfToken);
		xhr.upload.onprogress = function (e) { progress(e.loaded / e.total * 100); };
		xhr.onload = function () {
			if (xhr.status === 403) { failure('Your session has expired. Reload the page and try again.'); return; }
			if (xhr.status !== 200) { failure('Upload failed (HTTP ' + xhr.status + ').'); return; }
			try { success(JSON.parse(xhr.responseText).location); }
			catch (e) { failure('Unexpected response from the server.'); }
		};
		xhr.onerror = function () { failure('Image upload failed.'); };
		var formData = new FormData();
		formData.append('file', blobInfo.blob(), blobInfo.filename());
		formData.append('csrf_token', window.FlexaAdmin.csrfToken);
		xhr.send(formData);
	}

	if (window.tinymce) {
		var common = {
			menubar: false,
			branding: false,
			promotion: false,
			convert_urls: false,
			image_caption: true,
			resize: true,
			toolbar_sticky: true,
			toolbar_mode: 'sliding',
			plugins: 'lists link image table code preview media fullscreen',
			toolbar: 'undo redo | formatselect | bold italic underline | alignleft aligncenter alignright | bullist numlist | link image media table | gallery | removeformat code preview fullscreen',
			content_style: 'html { overflow-y: auto; } body { font-family: Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.7; }',
			automatic_uploads: true,
			images_upload_handler: uploadHandler,
			setup: function (editor) {
				editor.ui.registry.addButton('gallery', {
					text: 'Image library',
					onAction: function () {
						window.openMediaPicker(function (url, item, size) {
							var alt = (item && (item.alt_text || item.original_filename)) || '';
							var attrs = ' src="' + editor.dom.encode(url) + '" alt="' + editor.dom.encode(alt) + '"';
							if (size === 'original' && item && item.width && item.height) {
								// Keep the file's own dimensions.
								attrs += ' width="' + item.width + '" height="' + item.height + '"';
							} else {
								// Default: scale down to the content width, never up, and keep the aspect ratio.
								attrs += ' style="max-width:100%;height:auto;"';
							}
							editor.insertContent('<img' + attrs + '>');
						}, { withSize: true });
					}
				});
			}
		};
		tinymce.init($.extend({}, common, { selector: 'textarea.js-editor', height: 520, min_height: 320 }));
		tinymce.init($.extend({}, common, { selector: 'textarea.js-richtext', height: 300, min_height: 200 }));
	}

	function slugify(text) {
		return (text || '').toString().normalize('NFKC').toLowerCase().trim()
			.replace(/[^\p{L}\p{N}\s-]/gu, '')
			.replace(/[\s-]+/g, '-')
			.replace(/^-+|-+$/g, '');
	}
	var $slug = $('#slugInput');
	var $title = $('#titleInput');
	if ($slug.length && $title.length && !$slug.val()) {
		var userEdited = false;
		$slug.on('input', function () { userEdited = true; });
		$title.on('input', function () {
			if (!userEdited) { $slug.val(slugify($title.val())); }
		});
	}
})(window.jQuery);
</script>
