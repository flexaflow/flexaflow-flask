<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Set up FlexaFlow</title>
	<link rel="stylesheet" href="/static/bootstrap-and-related/bootstrap.min.css">
</head>
<body class="bg-light">
	<div class="container py-5" style="max-width: 720px;">
		<div class="card shadow-sm"><div class="card-body p-4">
			<h1 class="h4">No accounts yet</h1>
			<p>For security, the first administrator account is created from the command line on the server, not from the web.</p>
			<pre class="bg-dark text-light p-3 rounded">python manage.py createsuperuser</pre>
			<p class="mb-0 small text-muted">Then reload this page and log in. Other users can be added afterwards from <em>Users</em> in the admin.</p>
		</div></div>
	</div>
</body>
</html>
